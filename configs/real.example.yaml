# numeric_v2 실행 예시. 실제 reader/domain 계약(G2)이 pending이므로 실행 수락 불가.
# G1/G2 미확정: density_contracts/unit_bases를 지정하지 않으며 가중값/delta는 null.
# 사용자 gate 답변이나 synthetic 표시를 실제 자료에 임의 적용하지 않는다.
schema_version: numeric_config_v1
mode: real
output_dir: ../outputs/numeric_real
reference:
  data_dir: ../data/reference
  product_id: REFERENCE_PRODUCT
target:
  data_dir: ../data/target
  product_id: TARGET_PRODUCT
map:
  input:
    data_dir: ../data/reference
    product_id: REFERENCE_PRODUCT
  diameter_um: 5
review_rois:
  map_region_ids: []
  manual: []  # 명시 product/design/frame/case/center_xy_um와 원본 asset 연결 필요
