# compare2 설정 예시(schema compare2_config_v1). ETX 2b·8회차용: data/compare2.yaml 로 복사해 고친다.
# 경로는 모두 이 파일이 있는 폴더(실행기 BASE_DIR) 기준 상대 경로다. /로 시작하면 루트 아래 절대 경로가 된다.
schema_version: compare2_config_v1

# 기존 numeric_config_v1(real.yaml). 2회차와 같은 파일이며 reference/target 의 data_dir(1회차 import 결과)를 읽는다.
numeric_config: real.yaml

# compare2 출력 폴더. 실행기가 --out data/compare2 를 주면 그쪽이 우선한다.
output_dir: data/compare2

# 밀도 CSV 폴더. 제품군마다 파일 두 개: <제품군>_line.csv, <제품군>_pixel.csv (아래 model_groups 의 키 = 제품군 이름).
# CSV 형식: 첫 줄 = 빈칸 + 크기 헤더(예 3, 5, 10; "3um", "3µm" 도 됨), 이후 한 줄 = 레이어 이름 + 크기별 glass 당 개수.
# Excel 에서는 'CSV UTF-8' 로 저장한다. 빈 칸은 '값 없음'이고 0 이 아니다.
density_dir: data/density

# 제품군별 값은 사용자가 채운다. 키 이름 = 제품군 이름(파일 이름에 쓰이므로 / \ .. 금지).
# 군 이름이 mobile 또는 watch 이면 CRP 1.0, 그 밖은 2.92(설정하지 않는다).
model_groups:
  mobile:
    # glass 면적. value 가 null 이면 '미정'이며 오류가 아니다: vi 는 '대기'로 비고 compare2 는 종료 코드 3이다.
    # 값을 알면 숫자와 unit(mm2, um2, m2)을 함께 적는다(값이 있으면 unit 은 필수).
    glass_area: {value: null, unit: mm2}
    weight_line: 1.0                 # line 지표 가중치(양수)
    weight_pixel: 1.0                # pixel 지표 가중치(양수)

products:
  reference:
    model_group: mobile              # model_groups 의 키
    resolution: [1500, 1850]         # 패널 해상도(가로, 세로 픽셀 수, 양의 정수 둘)
    hotspot_root: data/input/hotspot/R00       # 1회차와 같은 hotspot 입력 폴더(CNO 폴더 lateralopen-CNO-<cnt층> 도 여기서 읽는다). 제품 폴더 이름으로 바꾼다
    unit_size_um: [45, 45]           # 선택. unit 한 변 µm(가로, 세로). 8회차 지도 위치 계산에 쓴다. 생략하면 hotspot frame 크기에서 (frame + 1000 px) / 2 로 계산한다
    # dl1_model: R00                 # 선택. 8회차 overlay 용 DL1 모델 폴더 이름(report.dl1_root 아래). overlay 를 그리려면 주석을 풀고 두 제품 모두 적는다
  target:
    model_group: mobile
    resolution: [1500, 1850]
    hotspot_root: data/input/hotspot/T00
    # dl1_model: T00

# 8회차(compare2-report) 전용. 키 전체 선택. 기본값: map_window_um 30, diameter_um 3, top_n 4, dl1_root 없음.
report:
  dl1_root: data/input/dl1           # 지도 3 µm 와 레이어 overlay 에 쓰는 DL1 root(Layer PNG). 생략하면 overlay 없이 지도만
  map_window_um: 30                  # 조건별 지도 창 한 변 µm
  diameter_um: 3                     # 지도에 그리는 hotspot 지름 µm
  top_n: 4                           # 지도와 설명 문장을 붙이는 상위 조건 수
