# ETX real.yaml 예시 — 03 단계 뒤(asset 키 포함) 형태. configs/etx/templates/real.yaml 과 같은 내용이다(테스트가 같음을 확인한다).
# real.stage2.example.yaml 에 asset_manifest·electrode_import_record 두 키만 더한 것이다.
# 03 출력(data/assets/<side>/)은 복사하지 않고 그 위치를 가리킨다. sha256 은 생략하면 03 이 남긴 기록으로 확인하고, 적으면 그 값과 엄격 비교한다.
# 이 파일을 실행기 BASE_DIR(작업 폴더)에 real.yaml로 둔다고 가정한다. 모든 상대 경로는 이 파일 위치(BASE_DIR) 기준이다(절대 경로·..·백슬래시 거부).
# product_id/source_id 외의 UNSPECIFIED는 "정해지지 않음" 이름표다. 실제 값을 알면 바꾼다(비워 두면 오류).
schema_version: numeric_config_v1
mode: real
output_dir: outputs/numeric_real
reference: &reference_side
  product_id: QA4_R00
  data_dir: data/imported/reference
  asset_manifest: {path: data/assets/reference/review_assets.json}
  electrode_import_record: {path: data/assets/reference/electrode_asset_import_record.json}
  condition_assignment:
    product_id: QA4_R00
    design_version: UNSPECIFIED
    source_id: QA4_R00_hotspot
    process_step_id: UNSPECIFIED
    exposure_id: UNSPECIFIED
    unit_id: UNSPECIFIED
    # stack_order는 클수록 위층(PXL 최상단)으로 가정했다. vertical_short는 큰 쪽 layer에 귀속된다.
    layer_stack: &layer_stack
      - {actual_layer: BML,  stack_order: 1,  density_process_layer: BML}
      - {actual_layer: ACT,  stack_order: 2,  density_process_layer: ACT}
      - {actual_layer: GAT1, stack_order: 3,  density_process_layer: GAT1}
      - {actual_layer: GATC, stack_order: 4,  density_process_layer: GATC}
      - {actual_layer: GAT2, stack_order: 5,  density_process_layer: GAT2}
      - {actual_layer: OACT, stack_order: 6,  density_process_layer: OACT}
      - {actual_layer: GAT3, stack_order: 7,  density_process_layer: GAT3}
      - {actual_layer: SD1,  stack_order: 8,  density_process_layer: SD1}
      - {actual_layer: SD2,  stack_order: 9,  density_process_layer: SD2}
      - {actual_layer: SD3,  stack_order: 10, density_process_layer: SD3}
      - {actual_layer: PXL,  stack_order: 11, density_process_layer: PXL}
    pair_table_path: data/input/pairs.csv
    interlayer_distance_path: data/input/thk_info-QA4_R00.txt
    # role = 전극 이름. pair 표의 모든 전극이 자기 이름을 role로 받는다(electrode_roles와 함께 쓰지 않는다).
    electrode_role_policy: electrode_id
    max_materialized_source_cells: 20000000000
    max_group_mask_cells: 5000000000
    # max_operation_bytes: 34359738368   # 예: 32 GiB. 물리 메모리를 넘기면 거부된다. 02 단계 전에 정한다(입력 해시에 들어간다)
target:
  product_id: QA4_T00
  data_dir: data/imported/target
  asset_manifest: {path: data/assets/target/review_assets.json}
  electrode_import_record: {path: data/assets/target/electrode_asset_import_record.json}
  condition_assignment:
    product_id: QA4_T00
    design_version: UNSPECIFIED
    source_id: QA4_T00_hotspot
    process_step_id: UNSPECIFIED
    exposure_id: UNSPECIFIED
    unit_id: UNSPECIFIED
    layer_stack: *layer_stack
    pair_table_path: data/input/pairs.csv
    interlayer_distance_path: data/input/thk_info-QA4_T00.txt
    # role = 전극 이름. pair 표의 모든 전극이 자기 이름을 role로 받는다(electrode_roles와 함께 쓰지 않는다).
    electrode_role_policy: electrode_id
    max_materialized_source_cells: 20000000000
    max_group_mask_cells: 5000000000
    # max_operation_bytes: 34359738368
map:
  input: *reference_side   # 전극 수 지도는 제품 하나(reference)
  diameter_um: 5
review_rois:
  map_region_ids: []
  manual: []
