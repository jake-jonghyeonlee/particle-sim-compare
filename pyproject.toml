[project]
name = "simcompare"
version = "0.1.0"
description = "Cross-product comparison and interpretation of display particle-defect simulation results (not a CA/hotspot predictor)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.scripts]
simcompare = "simcompare.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simcompare"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
